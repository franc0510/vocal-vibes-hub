<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VocMe</title>
    <meta name="description" content="Voice notes, between people who matter.">
    <meta name="author" content="VocMe" />

    <!--
      L'aperçu par défaut, celui de toutes les pages.

      Il annonçait « Lovable App — Lovable Generated Project » avec une capture
      d'écran de l'outil qui a servi à démarrer le projet : le premier lien
      VocMe partagé ne ressemblait pas à VocMe.

      Les invitations à un groupe, elles, remplacent ces balises par les leurs —
      nom du groupe compris — depuis `api/join-group.ts`, parce qu'aucun robot
      de messagerie n'exécute le JavaScript qui pourrait le faire ici.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VocMe" />
    <meta property="og:title" content="VocMe">
    <meta property="og:description" content="Voice notes, between people who matter.">
    <!-- Absolue, et non relative : WhatsApp et Facebook ignorent purement et
         simplement un chemin relatif, et l'aperçu repart sans image. Le
         domaine est celui qu'utilise déjà `src/lib/appUrl.ts` par défaut. -->
    <meta property="og:image" content="https://vocme-tawny.vercel.app/og-cover.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VocMe">
    <meta name="twitter:description" content="Voice notes, between people who matter.">
    <meta name="twitter:image" content="https://vocme-tawny.vercel.app/og-cover.png">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ef4444" />
    
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VocMe" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Permissions Policy -->
    <meta http-equiv="Permissions-Policy" content="microphone=(self)" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Enregistrer le service worker
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
