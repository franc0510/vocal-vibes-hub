name: Alléger les planches

# Les planches pèsent environ 1,1 Mo chacune : une anecdote de douze demande
# donc ~13 Mo au téléphone pendant que la voix joue déjà. Supabase ne sait pas
# les redimensionner à la volée sur ce forfait (403), alors on réencode les
# fichiers eux-mêmes, au même chemin.
#
#   Actions → Alléger les planches → Run workflow
#
# Les URL ne changent pas et aucune ligne de la base n'est touchée.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Que faire"
        required: true
        default: mesurer (n'écrit rien)
        type: choice
        options:
          - mesurer (n'écrit rien)
          - réencoder pour de vrai
      limit:
        description: "S'arrêter après N planches. Vide = toutes."
        required: false
        default: ""

jobs:
  shrink:
    name: Réencoder
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WRITE: ${{ inputs.action == 'réencoder pour de vrai' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY manquante — ce script réécrit des fichiers."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Réencoder
        env:
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=()
          if [ -n "$IN_LIMIT" ]; then
            ARGS+=(--limit "$IN_LIMIT")
          fi
          if [ "$WRITE" = "true" ]; then
            ARGS+=(--yes)
          fi
          npx tsx scripts/shrink-panels.ts "${ARGS[@]}"

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "## Poids des planches"
            echo
            if [ "$WRITE" = "true" ]; then
              echo "Les planches sont réencodées, aux mêmes URL."
              echo "Les téléphones qui les ont déjà en cache garderont l'ancienne version un temps."
            else
              echo "Rien n'a été écrit. Relance en choisissant **réencoder pour de vrai**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
