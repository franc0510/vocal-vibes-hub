name: Benchmark illustrations

# Lance le comparatif de modèles d'images depuis GitHub, sans rien installer.
#
#   Actions → Benchmark illustrations → Run workflow
#
# Par défaut le run ne dépense RIEN : il affiche seulement l'estimation et les
# anecdotes retenues. Choisir "générer les images" dans le premier menu pour
# lancer réellement la génération.
#
# Le résultat (planche contact HTML + CSV) est téléchargeable en artefact
# à la fin du run.
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   OPENAI_API_KEY  (obligatoire : construit les storyboards)
#   FAL_KEY         (obligatoire pour les modèles hébergés par fal)
#   GEMINI_API_KEY  (optionnel)
#
# Lire tes anecdotes ne demande AUCUN secret : la connexion Supabase est lue
# dans le .env du dépôt, exactement comme le fait l'application.
#
# ATTENTION : ce workflow n'apparaît dans l'onglet Actions que si ce fichier
# est présent sur la branche par défaut (main). C'est une règle de GitHub,
# pas une option — sur une branche de travail, le bouton n'existe pas.

on:
  workflow_dispatch:
    inputs:
      # Un menu plutôt qu'un mot à taper : impossible de se tromper, et le
      # choix par défaut est celui qui ne coûte rien.
      action:
        description: "Que faire"
        required: true
        default: estimer le coût (ne dépense rien)
        type: choice
        options:
          - estimer le coût (ne dépense rien)
          - générer les images (dépense réellement)
      titles:
        description: "Titres des anecdotes à tester, séparés par des points-virgules. Recherche approximative, une partie du titre suffit. Laisser vide pour utiliser le choix ci-dessous."
        required: false
        default: ""
      source:
        description: "Si aucun titre n'est donné : quelles anecdotes prendre"
        required: true
        default: mes vraies anecdotes
        type: choice
        options:
          - mes vraies anecdotes
          - exemples
      anecdotes:
        description: "COMBIEN d'anecdotes prendre (un nombre). Ignoré si des titres sont donnés."
        required: true
        default: "2"
      models:
        description: "Modèles, séparés par des virgules. Vide = tous les candidats."
        required: false
        default: ""

jobs:
  bench:
    name: Générer la planche contact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GENERATE: ${{ inputs.action == 'générer les images (dépense réellement)' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      # Échouer ici coûte 5 secondes ; échouer après npm ci et un appel réseau
      # en coûte 40, et le message se perd dans les logs.
      - name: Vérifier les secrets
        if: env.GENERATE == 'true'
        run: |
          MISSING=()
          [ -z "$OPENAI_API_KEY" ] && MISSING+=("OPENAI_API_KEY — construit les storyboards, indispensable")
          [ -z "$FAL_KEY" ] && MISSING+=("FAL_KEY — nécessaire pour 6 des 7 modèles")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Secrets manquants : la génération ne peut pas démarrer."
            printf '  • %s\n' "${MISSING[@]}"
            echo
            echo "À créer dans Settings → Secrets and variables → Actions → New repository secret."
            echo "Note : une clé posée dans Supabase n'est pas visible ici, il faut la redéclarer."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les options sont assemblées une seule fois, en shell plutôt qu'en
      # expressions imbriquées : plus lisible, et les titres à espaces et
      # accents sont correctement cités.
      - name: Préparer les options
        # Les entrées passent par l'environnement, jamais par interpolation
        # directe dans le shell : un titre contenant une apostrophe, un
        # guillemet ou un $ ne doit pas pouvoir casser — ni détourner — la
        # commande.
        env:
          IN_ANECDOTES: ${{ inputs.anecdotes }}
          IN_TITLES: ${{ inputs.titles }}
          IN_SOURCE: ${{ inputs.source }}
          IN_MODELS: ${{ inputs.models }}
        run: |
          ARGS=(--anecdotes "$IN_ANECDOTES")
          if [ -n "$IN_TITLES" ]; then
            ARGS+=(--titles "$IN_TITLES")
          elif [ "$IN_SOURCE" = "mes vraies anecdotes" ]; then
            ARGS+=(--from-db)
          fi
          if [ -n "$IN_MODELS" ]; then
            ARGS+=(--models "$IN_MODELS")
          fi
          printf '%s\n' "${ARGS[@]}" > /tmp/bench-args
          echo "Options : ${ARGS[*]}"

      # Tourne toujours. Sans confirmation, c'est tout le run — et il est vert.
      - name: Estimation
        run: |
          mapfile -t ARGS < /tmp/bench-args
          npx tsx scripts/bench-illustration.ts "${ARGS[@]}"

      - name: Génération
        if: env.GENERATE == 'true'
        run: |
          mapfile -t ARGS < /tmp/bench-args
          npx tsx scripts/bench-illustration.ts --yes "${ARGS[@]}"

      # Télécharge l'artefact, dézippe, ouvre index.html : la planche contact
      # s'affiche dans le navigateur, images comprises.
      - name: Publier la planche contact
        if: always() && env.GENERATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: planche-contact
          path: bench-output/
          retention-days: 30
          if-no-files-found: ignore

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "## Benchmark illustrations"
            echo
            if [ -f bench-output/results.csv ]; then
              echo "| Anecdote | Modèle | Cases | Coût \$ | Latence s | Erreur |"
              echo "|---|---|---|---|---|---|"
              tail -n +2 bench-output/results.csv | while IFS=, read -r a m p c l e; do
                echo "| $a | $m | $p | $c | $l | $e |"
              done
              echo
              echo "Télécharge l'artefact **planche-contact**, dézippe-le et ouvre \`index.html\`."
              echo "Le critère qui décide : le personnage reste-t-il le même d'une case à l'autre ?"
            elif [ "$GENERATE" = "true" ]; then
              echo "Aucune image produite — voir les logs de l'étape **Génération**."
            else
              echo "Estimation seulement, rien n'a été dépensé."
              echo
              echo "Les anecdotes retenues et le coût prévu sont dans les logs de l'étape **Estimation**."
              echo "Pour générer réellement, relance en choisissant **générer les images**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
