name: Benchmark illustrations

# Lance le comparatif de modèles d'images depuis GitHub, sans rien installer.
#
#   Actions → Benchmark illustrations → Run workflow
#
# Le résultat (planche contact HTML + CSV) est téléchargeable en artefact
# à la fin du run.
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   OPENAI_API_KEY  (obligatoire : construit les storyboards)
#   FAL_KEY         (obligatoire pour les modèles hébergés par fal)
#   GEMINI_API_KEY  (optionnel)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ce run dépense de l''argent réel. Taper "oui" pour confirmer.'
        required: true
        default: "non"
      anecdotes:
        description: "Nombre d'anecdotes à tester (1 à 5)"
        required: true
        default: "2"
      models:
        description: "Modèles, séparés par des virgules. Vide = tous les candidats."
        required: false
        default: ""

jobs:
  bench:
    name: Générer la planche contact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Vérifier la confirmation
        if: inputs.confirm != 'oui'
        run: |
          echo "::error::Run annulé : le champ de confirmation doit valoir exactement \"oui\"."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Estimation du coût
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/bench-illustration.ts \
            --anecdotes "${{ inputs.anecdotes }}" \
            ${{ inputs.models && format('--models {0}', inputs.models) || '' }}

      - name: Lancer le benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/bench-illustration.ts --yes \
            --anecdotes "${{ inputs.anecdotes }}" \
            ${{ inputs.models && format('--models {0}', inputs.models) || '' }}

      # Télécharge l'artefact, dézippe, ouvre index.html : la planche contact
      # s'affiche dans le navigateur, images comprises.
      - name: Publier la planche contact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planche-contact
          path: bench-output/
          retention-days: 30

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "## Benchmark illustrations"
            echo
            if [ -f bench-output/results.csv ]; then
              echo "| Anecdote | Modèle | Cases | Coût \$ | Latence s | Erreur |"
              echo "|---|---|---|---|---|---|"
              tail -n +2 bench-output/results.csv | while IFS=, read -r a m p c l e; do
                echo "| $a | $m | $p | $c | $l | $e |"
              done
            else
              echo "Aucun résultat produit — voir les logs ci-dessus."
            fi
            echo
            echo "Télécharge l'artefact **planche-contact**, dézippe-le et ouvre \`index.html\`."
            echo "Le critère qui décide : le personnage reste-t-il le même d'une case à l'autre ?"
          } >> "$GITHUB_STEP_SUMMARY"
